# zizmor configuration, read by the lint step in ci.yml
# (HCW-HybridCloudWorks#1575).
#
# adhoc-packages: the browser suite installs one exact Playwright version with
# `npm install "@playwright/test@<version>"`. This is a Python project with no
# npm lockfile, so zizmor counts the install as outside a lockfile. The version
# is pinned in the workflow, and the core-update compatibility check installs
# the same one. Kept on purpose for those two lines only: the ignore names the
# line, so a new install anywhere, or an edit that moves one of these, is
# flagged again for review (update the line number here once it is checked).
rules:
  adhoc-packages:
    ignore:
      - ci.yml:217
      - core-update.yml:213
