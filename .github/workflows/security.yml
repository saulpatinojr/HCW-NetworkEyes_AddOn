# Actions are pinned to full commit SHAs (version in the trailing comment); Dependabot (github-actions ecosystem) proposes updates.
name: security
on:
  pull_request:
  push: { branches: [main] }
  schedule: [{ cron: "23 6 * * 1" }]
permissions:
  contents: read
jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with: { fail-on-severity: moderate }
  codeql:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@4c0873ef8656cb3c50b3f42fb63bc1ade0cfa827 # v4
        with: { languages: "${{ matrix.language }}" }
      - uses: github/codeql-action/analyze@4c0873ef8656cb3c50b3f42fb63bc1ade0cfa827 # v4
        with: { category: "/language:${{ matrix.language }}" }
  secret-scan:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  pip-audit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.14" }
      - run: python -m pip install "uv==0.11.32"
      - run: uv sync --frozen
      - name: Known vulnerabilities in the runtime set the image installs (exported from uv.lock as the build does)
        run: |
          set -euo pipefail
          uv export --frozen --format requirements-txt --no-dev --no-emit-project --no-emit-workspace --no-header -o "${RUNNER_TEMP}/requirements.lock.txt"
          uv run pip-audit -r "${RUNNER_TEMP}/requirements.lock.txt" --strict
  base-follows-website:
    # CONTRACT-DECISIONS item 20: the base is the website's current pin. Weekly and on main, not on pull requests, so a
    # website bump is a signal to move versions.env and every FROM together, not a red mark on unrelated work.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: The base image is the website's current pin
        run: |
          set -euo pipefail
          site="$(curl -fsSL https://raw.githubusercontent.com/saulpatinojr/HCW-HybridCloudWorks/main/lab-image/versions.env)"
          want="$(printf '%s\n' "$site" | sed -n 's/^BASE_IMAGE=//p')@$(printf '%s\n' "$site" | sed -n 's/^BASE_DIGEST=//p')"
          have="$(sed -n 's/^BASE_IMAGE=//p' infrastructure/docker/versions.env)@$(sed -n 's/^BASE_DIGEST=//p' infrastructure/docker/versions.env)"
          case "$want" in *@sha256:*) ;; *) echo "::error::could not read the website's base pin"; exit 1 ;; esac
          [ "$have" = "$want" ] || { echo "::error file=infrastructure/docker/versions.env::base ${have} differs from the website's ${want}: move versions.env and every FROM together"; exit 1; }
          echo "base ${have} is the website's pin"
