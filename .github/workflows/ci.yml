# Actions are pinned to full commit SHAs (version in the trailing comment); Dependabot (github-actions ecosystem) proposes updates.
# Runners: ubuntu-26.04, never ubuntu-latest (program convention). uv is installed with pip at the exact version this
# repository was authored with, because astral-sh/setup-uv is pinned nowhere in scope (conventions-actions.md).
name: ci
on:
  pull_request:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
env:
  UV_VERSION: "0.11.32"
  PYTHON_VERSION: "3.14"
jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: python -m pip install "uv==${{ env.UV_VERSION }}"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Base image digest in versions.env matches every FROM in the Dockerfile
        run: |
          set -euo pipefail
          want="$(sed -n 's/^BASE_IMAGE=//p' infrastructure/docker/versions.env)@$(sed -n 's/^BASE_DIGEST=//p' infrastructure/docker/versions.env)"
          case "$want" in *@sha256:*) ;; *) echo "::error::versions.env is not image@sha256:digest"; exit 1 ;; esac
          stages=" "; bad=0
          while read -r _ from as name _; do
            if [[ "$stages" == *" ${from} "* ]]; then echo "ok FROM ${from} (earlier stage)"
            elif [ "$from" = "$want" ]; then echo "ok FROM ${from}"
            else echo "::error file=infrastructure/docker/Dockerfile::FROM ${from} is neither an earlier stage nor ${want}"; bad=1; fi
            if [ "${as,,}" = as ] && [ -n "$name" ]; then stages="${stages}${name} "; fi
          done < <(grep -E '^FROM ' infrastructure/docker/Dockerfile)
          exit $bad
      # uv.lock is the only lock: the image build exports it (Dockerfile), so there is no committed export to drift.
      - name: uv.lock is current with pyproject.toml
        run: uv lock --check
      # UV_VERSION is the one uv version. The digest is resolved from the registry, so a tag bumped without its digest
      # fails here rather than exporting with the old uv; the two workflows that install uv by version follow it too.
      - name: The Dockerfile and every workflow use the uv this workflow uses
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "ghcr.io/astral-sh/uv:${UV_VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          case "$digest" in sha256:*) ;; *) echo "::error::could not resolve ghcr.io/astral-sh/uv:${UV_VERSION}"; exit 1 ;; esac
          grep -Fq "COPY --from=ghcr.io/astral-sh/uv:${UV_VERSION}@${digest} /uv " infrastructure/docker/Dockerfile \
            || { echo "::error file=infrastructure/docker/Dockerfile::the uv image is not ghcr.io/astral-sh/uv:${UV_VERSION}@${digest}"; exit 1; }
          for f in .github/workflows/security.yml .github/workflows/core-update.yml; do
            grep -Fq "\"uv==${UV_VERSION}\"" "$f" || { echo "::error file=${f}::installs a uv other than ${UV_VERSION}"; exit 1; }
          done
  image:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The build stage exports uv.lock, so a lock or Dockerfile change is proven here, not first at a release tag.
      - name: The lab image builds and keeps its edition boundary
        run: |
          set -euo pipefail
          docker build -f infrastructure/docker/Dockerfile --build-arg EDITION=lab -t addon:ci .
          if docker run --rm --entrypoint python addon:ci -c 'import azure' 2>/dev/null; then
            echo '::error::azure is importable in the lab image'; exit 1
          fi
          docker run --rm --entrypoint python addon:ci -c 'import fastapi, pydantic, uvicorn'
          # Which engine the image runs: the pinned wheel once ENGINE_REF names a version, the interim port before.
          docker run --rm --entrypoint python addon:ci -c 'from network_assessment import engine; print("engine:", engine.SOURCE)'
      # The base digest is checked against every FROM in the lint job; this checks what that digest really contains.
      # versions.env moves BASE_IMAGE, BASE_DIGEST and BASE_PYTHON_VERSION together, so a digest that does not hold the
      # Python it claims fails here instead of in production.
      - name: The image runs the Python that versions.env names (BASE_PYTHON_VERSION)
        run: |
          set -euo pipefail
          want="$(sed -n 's/^BASE_PYTHON_VERSION=//p' infrastructure/docker/versions.env)"
          [ -n "$want" ] || { echo "::error file=infrastructure/docker/versions.env::BASE_PYTHON_VERSION is missing"; exit 1; }
          have="$(docker run --rm --entrypoint python addon:ci --version 2>&1 | tr -d '\r')"
          [ "$have" = "Python ${want}" ] || { echo "::error file=infrastructure/docker/versions.env::the built image runs '${have}', but BASE_PYTHON_VERSION is ${want}"; exit 1; }
          echo "image python: ${have} (BASE_PYTHON_VERSION=${want})"
      - name: The image states its open-source licence (org.opencontainers.image.licenses is the SPDX id of LICENSE)
        run: |
          set -euo pipefail
          head -n 1 LICENSE | tr -d '\r' | grep -qx 'MIT License' || { echo '::error file=LICENSE::LICENSE is not the MIT License; change the licence label in infrastructure/docker/Dockerfile, the two checks in ci.yml and publish-images.yml, and NOTICE and README with it'; exit 1; }
          have="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}' addon:ci)"
          [ "$have" = "MIT" ] || { echo "::error file=infrastructure/docker/Dockerfile::org.opencontainers.image.licenses is '${have}' in the built image; it must be MIT (the SPDX id of LICENSE)"; exit 1; }
          echo "image licence label: ${have}"
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: python -m pip install "uv==${{ env.UV_VERSION }}"
      - run: uv sync --frozen
      - name: Unit, contract, security and manifest tests with the 85 percent coverage gate
        run: uv run pytest -q --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - name: Startup refusal under an identity endpoint
        run: |
          set +e
          IDENTITY_ENDPOINT=http://169.254.169.254 uv run python -c "import network_assessment.app"
          code=$?
          set -e
          test "$code" -ne 0 && echo "refused as expected (exit $code)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: coverage, path: coverage.xml, if-no-files-found: error }
  rules-doc:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: python -m pip install "uv==${{ env.UV_VERSION }}"
      - run: uv sync --frozen
      - name: docs/rules/catalog.md is generated from the registry (drift check; registry texts hedge-free)
        run: uv run python scripts/rules-doc.py --check
  e2e:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: python -m pip install "uv==${{ env.UV_VERSION }}"
      - run: uv sync --frozen
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 26 }
      - name: Playwright (exact version) and chromium
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-audit --no-fund "@playwright/test@1.63.0"
          npx playwright install --with-deps chromium
      - run: CI=1 npx playwright test -c tests/e2e/playwright.config.ts
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: playwright-traces, path: test-results, if-no-files-found: ignore }
  package:
    runs-on: ubuntu-26.04
    needs: [lint, test, rules-doc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash scripts/package-repository.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: hcw-networkeyes-addon, path: hcw-networkeyes-addon.zip, if-no-files-found: error }
