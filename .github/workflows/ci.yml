# Actions are pinned to full commit SHAs (version in the trailing comment); Dependabot (github-actions ecosystem) proposes updates.
# Runners: ubuntu-26.04, never ubuntu-latest (program convention). uv is installed with pip at the exact version this
# repository was authored with, because astral-sh/setup-uv is pinned nowhere in scope (conventions-actions.md).
name: ci
on:
  pull_request:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
env:
  UV_VERSION: "0.11.32"
  PYTHON_VERSION: "3.15"
jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: python -m pip install "uv==${{ env.UV_VERSION }}"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Base image digest in versions.env matches every FROM in the Dockerfile
        run: |
          set -euo pipefail
          want="$(sed -n 's/^BASE_IMAGE=//p' infrastructure/docker/versions.env)@$(sed -n 's/^BASE_DIGEST=//p' infrastructure/docker/versions.env)"
          case "$want" in *@sha256:*) ;; *) echo "::error::versions.env is not image@sha256:digest"; exit 1 ;; esac
          stages=" "; bad=0
          while read -r _ from as name _; do
            if [[ "$stages" == *" ${from} "* ]]; then echo "ok FROM ${from} (earlier stage)"
            elif [ "$from" = "$want" ]; then echo "ok FROM ${from}"
            else echo "::error file=infrastructure/docker/Dockerfile::FROM ${from} is neither an earlier stage nor ${want}"; bad=1; fi
            if [ "${as,,}" = as ] && [ -n "$name" ]; then stages="${stages}${name} "; fi
          done < <(grep -E '^FROM ' infrastructure/docker/Dockerfile)
          exit $bad
      # uv.lock is the only lock: the image build exports it (Dockerfile), so there is no committed export to drift.
      - name: uv.lock is current with pyproject.toml
        run: uv lock --check
      # UV_VERSION is the one uv version. The digest is resolved from the registry, so a tag bumped without its digest
      # fails here rather than exporting with the old uv; the two workflows that install uv by version follow it too.
      - name: The Dockerfile and every workflow use the uv this workflow uses
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "ghcr.io/astral-sh/uv:${UV_VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          case "$digest" in sha256:*) ;; *) echo "::error::could not resolve ghcr.io/astral-sh/uv:${UV_VERSION}"; exit 1 ;; esac
          grep -Fq "COPY --from=ghcr.io/astral-sh/uv:${UV_VERSION}@${digest} /uv " infrastructure/docker/Dockerfile \
            || { echo "::error file=infrastructure/docker/Dockerfile::the uv image is not ghcr.io/astral-sh/uv:${UV_VERSION}@${digest}"; exit 1; }
          for f in .github/workflows/security.yml .github/workflows/core-update.yml; do
            grep -Fq "\"uv==${UV_VERSION}\"" "$f" || { echo "::error file=${f}::installs a uv other than ${UV_VERSION}"; exit 1; }
          done

      # Workflow and Dockerfile linters (HCW-HybridCloudWorks#1575): the
      # same three tools, versions and digests as the website's CI. CodeRabbit
      # used to run them and was removed on 2026-11-06. Each tool is a pinned
      # release whose SHA-256 is written here; move a version and its digest
      # together. Each linter runs even when the one before it failed, so one
      # run shows every finding.
      - name: Install actionlint, hadolint and zizmor (pinned, digests checked)
        id: lint-tools
        # Runs after an earlier failure in this job too, so one run reports the
        # linters' findings beside whatever else failed.
        if: ${{ !cancelled() }}
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          HADOLINT_VERSION: 2.14.0
          HADOLINT_SHA256: 6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47
          ZIZMOR_VERSION: 1.31.1
          ZIZMOR_SHA256: 58e878eb2dbd2c6183c105e1ac28c14f7dd1eca44a783f1fe2a69647d012c410
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/lint-tools"
          mkdir -p "$tools"
          cd "$tools"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 --retry-all-errors -o "$tarball" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          curl -sSfL --retry 3 --retry-all-errors -o hadolint "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum -c -
          chmod 0755 actionlint hadolint
          # zizmor in its own environment: one wheel, one hash, nothing else.
          python3 -m venv zizmor-env
          echo "zizmor==${ZIZMOR_VERSION} --hash=sha256:${ZIZMOR_SHA256}" > zizmor-requirements.txt
          zizmor-env/bin/python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes -r zizmor-requirements.txt
          ln -s "$tools/zizmor-env/bin/zizmor" zizmor
          echo "$tools" >> "$GITHUB_PATH"

      - name: actionlint
        if: ${{ !cancelled() && steps.lint-tools.outcome == 'success' }}
        run: |
          actionlint -version
          actionlint -color

      - name: zizmor
        if: ${{ !cancelled() && steps.lint-tools.outcome == 'success' }}
        run: |
          zizmor --version
          args=(--offline --format=github)
          if [ -f .github/zizmor.yml ]; then args+=(--config .github/zizmor.yml); fi
          zizmor "${args[@]}" .github/workflows

      - name: hadolint
        if: ${{ !cancelled() && steps.lint-tools.outcome == 'success' }}
        run: |
          set -euo pipefail
          hadolint --version
          # Written to a file first, so a failing git stops the step (inside
          # `< <(...)` its failure would be lost and read as "none tracked").
          list="${RUNNER_TEMP}/dockerfiles"
          git ls-files -z -- ':(glob)**/Dockerfile' ':(glob)**/Dockerfile.*' ':(glob)**/*.Dockerfile' > "$list"
          mapfile -d '' files < "$list"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no Dockerfile is tracked; nothing to lint"
            exit 0
          fi
          printf 'linting %s\n' "${files[@]}"
          hadolint --failure-threshold warning --format tty "${files[@]}"

  image:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The build stage exports uv.lock, so a lock or Dockerfile change is proven here, not first at a release tag.
      - name: The lab image builds and keeps its edition boundary
        run: |
          set -euo pipefail
          # PUBLISH_CACHE_BUST: the same per-run value publish-images.yml passes, so the security-update layer of the
          # Dockerfile is built afresh here too (the runner has no build cache across runs, so this is for parity).
          docker build -f infrastructure/docker/Dockerfile --build-arg EDITION=lab \
            --build-arg "PUBLISH_CACHE_BUST=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -t addon:ci .
          if docker run --rm --entrypoint python addon:ci -c 'import azure' 2>/dev/null; then
            echo '::error::azure is importable in the lab image'; exit 1
          fi
          docker run --rm --entrypoint python addon:ci -c 'import fastapi, pydantic, uvicorn'
          # The image runs the engine wheel pyproject.toml pins on the ENGINE_REF line (the only engine, ADR-0006).
          test "$(grep -cE '#[[:space:]]*ENGINE_REF[[:space:]]' pyproject.toml)" = 1 || { echo '::error file=pyproject.toml::expected exactly one ENGINE_REF line'; exit 1; }
          ref="$(grep -oE '#[[:space:]]*ENGINE_REF[[:space:]]+[0-9A-Za-z][0-9A-Za-z.+-]*' pyproject.toml | awk '{print $NF}')"
          have="$(docker run --rm --entrypoint python addon:ci -c 'from network_assessment import engine; print(engine.VERSION or "none", engine.SOURCE)')"
          [ "${have%% *}" = "$ref" ] || { echo "::error file=pyproject.toml::the image runs engine '${have}', but ENGINE_REF is ${ref}"; exit 1; }
          echo "engine: ${have} (ENGINE_REF ${ref})"
      # The base digest is checked against every FROM in the lint job; this checks what that digest really contains.
      # versions.env moves BASE_IMAGE, BASE_DIGEST and BASE_PYTHON_VERSION together, so a digest that does not hold the
      # Python it claims fails here instead of in production.
      - name: The image runs the Python that versions.env names (BASE_PYTHON_VERSION)
        run: |
          set -euo pipefail
          want="$(sed -n 's/^BASE_PYTHON_VERSION=//p' infrastructure/docker/versions.env)"
          [ -n "$want" ] || { echo "::error file=infrastructure/docker/versions.env::BASE_PYTHON_VERSION is missing"; exit 1; }
          have="$(docker run --rm --entrypoint python addon:ci --version 2>&1 | tr -d '\r')"
          [ "$have" = "Python ${want}" ] || { echo "::error file=infrastructure/docker/versions.env::the built image runs '${have}', but BASE_PYTHON_VERSION is ${want}"; exit 1; }
          echo "image python: ${have} (BASE_PYTHON_VERSION=${want})"
      - name: The image states its open-source licences (MIT for this code, Apache-2.0 for the engine) and carries their texts
        run: |
          set -euo pipefail
          head -n 1 LICENSE | tr -d '\r' | grep -qx 'MIT License' || { echo '::error file=LICENSE::LICENSE is not the MIT License; change the licence label in infrastructure/docker/Dockerfile, the two checks in ci.yml and publish-images.yml, and NOTICE and README with it'; exit 1; }
          have="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}' addon:ci)"
          [ "$have" = "MIT AND Apache-2.0" ] || { echo "::error file=infrastructure/docker/Dockerfile::org.opencontainers.image.licenses is '${have}' in the built image; it must be 'MIT AND Apache-2.0' (this code is MIT, the engine wheel Apache-2.0)"; exit 1; }
          for f in hcw-networkeyes-addon/LICENSE hcw-networkeyes-addon/NOTICE network-assessment-azure-engine/LICENSE network-assessment-azure-engine/NOTICE; do
            docker run --rm --entrypoint test addon:ci -s "/usr/share/licenses/${f}" || { echo "::error file=infrastructure/docker/Dockerfile::/usr/share/licenses/${f} is missing or empty in the built image"; exit 1; }
          done
          echo "image licence label: ${have}; licence texts under /usr/share/licenses/"
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: python -m pip install "uv==${{ env.UV_VERSION }}"
      - run: uv sync --frozen
      - name: Unit, contract, security and manifest tests with the 85 percent coverage gate
        run: uv run pytest -q --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - name: Startup refusal under an identity endpoint
        run: |
          set +e
          IDENTITY_ENDPOINT=http://169.254.169.254 uv run python -c "import network_assessment.app"
          code=$?
          set -e
          test "$code" -ne 0 && echo "refused as expected (exit $code)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: coverage, path: coverage.xml, if-no-files-found: error }
  rules-doc:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: python -m pip install "uv==${{ env.UV_VERSION }}"
      - run: uv sync --frozen
      - name: docs/rules/catalog.md is generated from the registry (drift check; registry texts hedge-free)
        run: uv run python scripts/rules-doc.py --check
  e2e:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: python -m pip install "uv==${{ env.UV_VERSION }}"
      - run: uv sync --frozen
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 26 }
      - name: Playwright (exact version) and chromium
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-audit --no-fund "@playwright/test@1.63.0"
          npx playwright install --with-deps chromium
      - run: CI=1 npx playwright test -c tests/e2e/playwright.config.ts
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: playwright-traces, path: test-results, if-no-files-found: ignore }
  package:
    runs-on: ubuntu-26.04
    needs: [lint, test, rules-doc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: bash scripts/package-repository.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: hcw-networkeyes-addon, path: hcw-networkeyes-addon.zip, if-no-files-found: error }
