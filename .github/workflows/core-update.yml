# Actions are pinned to full commit SHAs (version in the trailing comment); Dependabot (github-actions ecosystem) proposes updates.
# Upstream -> downstream flow (ADR-0001, ADR-0004; ADR-0028 by analogy). The App (saulpatinojr/HCW-NetworkEyes_App,
# REFACTOR_APP.md change sets C and J) builds the engine wheel cna-azure-network-engine on every `engine-v*` tag and
# attaches it to the GitHub Release (320-release-engine.yml); PyPI publishing there is optional and not needed here.
# This repository then pins the release asset by URL in pyproject.toml, on one line, as
#   "cna-azure-network-engine @ https://github.com/saulpatinojr/HCW-NetworkEyes_App/releases/download/engine-v<version>/cna_azure_network_engine-<version>-py3-none-any.whl",  # ENGINE_REF <version>
# `uv lock` records the wheel's sha256 and `uv export` writes it to requirements.lock.txt, so the image's
# `pip install --require-hashes` keeps verifying every third-party file (a git+https pin cannot be hash-checked and would
# break that build). Adopting the wheel deletes the ported copy under src/network_assessment/{model,rules,classify} and
# the PROVENANCE.md rows for it. This workflow compares the pinned ENGINE_REF with the App's latest `engine-v*` release on
# every run. Until the ENGINE_REF line exists, the comparison below finds nothing and exits cleanly.
# Pull requests opened with GITHUB_TOKEN do not trigger other workflows, so the compatibility check runs here.
name: core-update
on:
  schedule: [{ cron: "41 */6 * * *" }]
  workflow_dispatch:
    inputs:
      ref:
        description: "App engine release tag to adopt (engine-v*; default: latest engine release)"
        required: false
permissions:
  contents: write
  pull-requests: write
env:
  UPSTREAM: saulpatinojr/HCW-NetworkEyes_App
  PACKAGE: cna-azure-network-engine
jobs:
  check-and-bump:
    runs-on: ubuntu-26.04
    steps:
      # persist-credentials: false — create-pull-request sets its own Authorization header for the push; with the
      # checkout's persisted header beside it, git sends two and GitHub answers 400 (seen in the upstream App's rules-refresh).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - id: refs
        name: Compare the pinned ENGINE_REF with the App's latest engine release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", REQUESTED: "${{ inputs.ref }}" }
        run: |
          set -euo pipefail
          current="$(grep -oE "#[[:space:]]*ENGINE_REF[[:space:]]+[0-9][0-9A-Za-z.+-]*" pyproject.toml | head -1 | awk '{print $NF}' || true)"
          if [ -z "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no ENGINE_REF in pyproject.toml: the engine is still the ported copy under src/network_assessment (ADR-0001); nothing to adopt yet"
            exit 0
          fi
          if [ -n "$REQUESTED" ]; then latest_tag="$REQUESTED"; else
            latest_tag="$(gh api "repos/${UPSTREAM}/releases?per_page=50" --jq '[.[] | select(.draft == false and .prerelease == false and (.tag_name | startswith("engine-v")))][0].tag_name' 2>/dev/null || true)"
          fi
          if [ -z "$latest_tag" ] || [ "$latest_tag" = "null" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "::notice::the App has no engine-v* release yet"; exit 0; fi
          latest="${latest_tag#engine-v}"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"; echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "already at $current"; else echo "changed=true" >> "$GITHUB_OUTPUT"; echo "$current -> $latest"; fi
      - if: steps.refs.outputs.changed == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.14" }
      - if: steps.refs.outputs.changed == 'true'
        run: python -m pip install "uv==0.11.32"
      - if: steps.refs.outputs.changed == 'true'
        name: Bump ENGINE_REF and re-lock
        env: { LATEST: "${{ steps.refs.outputs.latest }}", CURRENT: "${{ steps.refs.outputs.current }}" }
        run: |
          set -euo pipefail
          # One line carries the release tag, the wheel file name and the ENGINE_REF marker; all three move together.
          sed -i -E "s|releases/download/engine-v${CURRENT}/cna_azure_network_engine-${CURRENT}-py3-none-any\.whl(\",?[[:space:]]*#[[:space:]]*ENGINE_REF[[:space:]]+)${CURRENT}|releases/download/engine-v${LATEST}/cna_azure_network_engine-${LATEST}-py3-none-any.whl\1${LATEST}|" pyproject.toml
          grep -q "ENGINE_REF ${LATEST}" pyproject.toml
          uv lock --upgrade-package "${PACKAGE}"
          uv export --format requirements-txt --no-dev --no-emit-project --no-emit-workspace --no-header -o requirements.lock.txt
          git --no-pager diff --stat
      - if: steps.refs.outputs.changed == 'true'
        id: compat
        name: Compatibility check (lint, tests, rule catalog drift, browser e2e)
        continue-on-error: true
        run: |
          set -euo pipefail
          uv sync --frozen
          uv run ruff check . && uv run python scripts/rules-doc.py --check && uv run pytest -q
          npm init -y >/dev/null && npm install --no-save --no-audit --no-fund "@playwright/test@1.63.0" && npx playwright install --with-deps chromium
          CI=1 npx playwright test -c tests/e2e/playwright.config.ts
      - if: steps.refs.outputs.changed == 'true'
        id: pr
        name: Open the bump pull request (ready for review)
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          branch: core-update/engine-v${{ steps.refs.outputs.latest }}
          title: "core: adopt engine ${{ steps.refs.outputs.latest }} (${{ steps.compat.outcome == 'success' && 'compatible' || 'needs adaptation' }})"
          commit-message: "core: bump cna-azure-network-engine ${{ steps.refs.outputs.current }} -> ${{ steps.refs.outputs.latest }}"
          labels: core-update,${{ steps.compat.outcome == 'success' && 'compatible' || 'needs-adaptation' }}
          add-paths: |
            pyproject.toml
            uv.lock
            requirements.lock.txt
          body: |
            The App `saulpatinojr/HCW-NetworkEyes_App` released engine **${{ steps.refs.outputs.latest }}** (this edition pinned `${{ steps.refs.outputs.current }}`).

            Compatibility check in this workflow run (lint, unit, contract, security, rule catalog drift, Playwright e2e): **${{ steps.compat.outcome }}**.
            Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            - compatible: merge (automatic if the repository variable `CORE_AUTOMERGE` is `true`).
            - needs adaptation: fix this edition on this branch (`RULES_VERSION` digest, sample expectations, the OpenAPI spec), then merge.

            ADR-0001 (interim ported engine), ADR-0004 (upstream/downstream for this AddOn), ADR-0028 (by analogy).
      - if: steps.refs.outputs.changed == 'true' && steps.compat.outcome == 'success' && vars.CORE_AUTOMERGE == 'true' && steps.pr.outputs.pull-request-number != ''
        name: Auto-merge the compatible bump
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh pr merge --squash --auto "${{ steps.pr.outputs.pull-request-number }}"
      - if: steps.refs.outputs.changed == 'true' && steps.compat.outcome != 'success'
        run: echo "::warning::Engine ${{ steps.refs.outputs.latest }} is not compatible with this edition; see the pull request."
