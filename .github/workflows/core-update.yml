# Actions are pinned to full commit SHAs (version in the trailing comment); Dependabot (github-actions ecosystem) proposes updates.
# Upstream -> downstream flow (ADR-0001, ADR-0004; ADR-0028 by analogy). INERT until the Core
# (saulpatinojr/Work-Cloud_Network_Core, REFACTOR_APP.md change sets C and J) publishes the engine wheel
# cna-azure-network-engine. This repository then pins it in pyproject.toml as
#   "cna-azure-network-engine==<version>"   # ENGINE_REF
# deletes its ported copy under src/network_assessment/{model,rules,classify} (and the PROVENANCE.md rows for them),
# and this workflow compares the pinned ENGINE_REF with the Core's latest `engine-v*` release on every run. Until the
# ENGINE_REF line exists, the comparison below finds nothing and exits cleanly.
# Pull requests opened with GITHUB_TOKEN do not trigger other workflows, so the compatibility check runs here.
name: core-update
on:
  schedule: [{ cron: "41 */6 * * *" }]
  workflow_dispatch:
    inputs:
      ref:
        description: "Core engine release tag to adopt (engine-v*; default: latest engine release)"
        required: false
permissions:
  contents: write
  pull-requests: write
env:
  UPSTREAM: saulpatinojr/Work-Cloud_Network_Core
  PACKAGE: cna-azure-network-engine
jobs:
  check-and-bump:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: refs
        name: Compare the pinned ENGINE_REF with the Core's latest engine release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", REQUESTED: "${{ inputs.ref }}" }
        run: |
          set -euo pipefail
          current="$(grep -oE "\"${PACKAGE}==[0-9][0-9A-Za-z.+-]*\"[[:space:]]*#[[:space:]]*ENGINE_REF" pyproject.toml | head -1 | sed -E "s/.*==([^\"]*)\".*/\1/" || true)"
          if [ -z "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no ENGINE_REF in pyproject.toml: the engine is still the ported copy under src/network_assessment (ADR-0001); nothing to adopt yet"
            exit 0
          fi
          if [ -n "$REQUESTED" ]; then latest_tag="$REQUESTED"; else
            latest_tag="$(gh api "repos/${UPSTREAM}/releases?per_page=50" --jq '[.[] | select(.draft == false and .prerelease == false and (.tag_name | startswith("engine-v")))][0].tag_name' 2>/dev/null || true)"
          fi
          if [ -z "$latest_tag" ] || [ "$latest_tag" = "null" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "::notice::the Core has no engine-v* release yet"; exit 0; fi
          latest="${latest_tag#engine-v}"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"; echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "already at $current"; else echo "changed=true" >> "$GITHUB_OUTPUT"; echo "$current -> $latest"; fi
      - if: steps.refs.outputs.changed == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.14" }
      - if: steps.refs.outputs.changed == 'true'
        run: python -m pip install "uv==0.11.32"
      - if: steps.refs.outputs.changed == 'true'
        name: Bump ENGINE_REF and re-lock
        env: { LATEST: "${{ steps.refs.outputs.latest }}", CURRENT: "${{ steps.refs.outputs.current }}" }
        run: |
          set -euo pipefail
          sed -i -E "s/\"${PACKAGE}==${CURRENT}\"([[:space:]]*#[[:space:]]*ENGINE_REF)/\"${PACKAGE}==${LATEST}\"\1/" pyproject.toml
          uv lock --upgrade-package "${PACKAGE}"
          uv export --format requirements-txt --no-dev --no-emit-project --no-emit-workspace --no-header -o requirements.lock.txt
          git --no-pager diff --stat
      - if: steps.refs.outputs.changed == 'true'
        id: compat
        name: Compatibility check (lint, tests, rule catalog drift, browser e2e)
        continue-on-error: true
        run: |
          set -euo pipefail
          uv sync --frozen
          uv run ruff check . && uv run python scripts/rules-doc.py --check && uv run pytest -q
          npm init -y >/dev/null && npm install --no-save --no-audit --no-fund "@playwright/test@1.63.0" && npx playwright install --with-deps chromium
          CI=1 npx playwright test -c tests/e2e/playwright.config.ts
      - if: steps.refs.outputs.changed == 'true'
        id: pr
        name: Open the bump pull request (ready for review)
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: core-update/engine-v${{ steps.refs.outputs.latest }}
          title: "core: adopt engine ${{ steps.refs.outputs.latest }} (${{ steps.compat.outcome == 'success' && 'compatible' || 'needs adaptation' }})"
          commit-message: "core: bump cna-azure-network-engine ${{ steps.refs.outputs.current }} -> ${{ steps.refs.outputs.latest }}"
          labels: core-update,${{ steps.compat.outcome == 'success' && 'compatible' || 'needs-adaptation' }}
          add-paths: |
            pyproject.toml
            uv.lock
            requirements.lock.txt
          body: |
            The Core `saulpatinojr/Work-Cloud_Network_Core` released engine **${{ steps.refs.outputs.latest }}** (this edition pinned `${{ steps.refs.outputs.current }}`).

            Compatibility check in this workflow run (lint, unit, contract, security, rule catalog drift, Playwright e2e): **${{ steps.compat.outcome }}**.
            Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            - compatible: merge (automatic if the repository variable `CORE_AUTOMERGE` is `true`).
            - needs adaptation: fix this edition on this branch (`RULES_VERSION` digest, sample expectations, the OpenAPI spec), then merge.

            ADR-0001 (interim ported engine), ADR-0004 (upstream/downstream for this AddOn), ADR-0028 (by analogy).
      - if: steps.refs.outputs.changed == 'true' && steps.compat.outcome == 'success' && vars.CORE_AUTOMERGE == 'true' && steps.pr.outputs.pull-request-number != ''
        name: Auto-merge the compatible bump
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh pr merge --squash --auto "${{ steps.pr.outputs.pull-request-number }}"
      - if: steps.refs.outputs.changed == 'true' && steps.compat.outcome != 'success'
        run: echo "::warning::Engine ${{ steps.refs.outputs.latest }} is not compatible with this edition; see the pull request."
