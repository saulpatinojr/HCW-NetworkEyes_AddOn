[project]
name = "hcw-addon-network-assessment"
version = "0.1.3"
description = "Hybrid Cloud Works Network Assessment, lab edition: evaluate an Azure Resource Graph export of microsoft.network/* resources against typed network rules, in memory, with no cloud connectivity by design."
readme = "README.md"
license = "MIT"
requires-python = ">=3.15.1,<3.16"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "network-assessment-azure-engine @ https://github.com/saulpatinojr/HCW-NetworkEyes_App/releases/download/engine-v0.1.5/network_assessment_azure_engine-0.1.5-py3-none-any.whl",  # ENGINE_REF 0.1.5
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.4",
  "httpx==0.28.1",
  "pip-audit==2.10.1",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/network_assessment"]

[tool.hatch.metadata]
# The engine wheel is pinned by its release URL (the marked engine dependency line); hatchling refuses a direct reference
# without this. uv.lock carries the wheel's sha256 and the image installs with --require-hashes.
allow-direct-references = true

[tool.uv]
# One project, no workspace member: the engine is the wheel pinned on the marked dependency line (ADR-0006), and
# src/network_assessment/engine.py refuses to start without it.
package = true

# What the engine (the wheel pinned on the ENGINE_REF line) depends on, copied from the METADATA file inside the wheel,
# its optional `azure` extra included (this edition never installs that extra; listing it keeps the lock the same as
# when uv read the wheel itself). Why it is here: whenever uv re-resolves the lock (`uv lock`, `uv lock --check`, and
# Dependabot's uv job for every update it tries), uv 0.13 and later first send a HEAD (a request for the file's headers
# only) to the wheel's address. GitHub answers with a redirect to a signed download link that answered that HEAD with
# 401 (not authorised) from a cloud session on 2026-11-13, so the lock failed. With this entry uv does not ask the
# address at all; the wheel's URL and sha256 in uv.lock are unchanged. The Cloud Crawler add-on has the same entry for
# the same reason. The name must be the pinned distribution and the version the pinned wheel's: core-update.yml moves
# the version with the pin (the ENGINE_METADATA marker), and tests/security/test_engine_static_metadata.py compares the
# entry with the installed wheel. Do not add requires-python here: Dependabot rewrites every requires-python in the
# lock to the project's. Runbook: "Keeping uv away from the engine's address".
[[tool.uv.dependency-metadata]]
name = "network-assessment-azure-engine"
version = "0.1.5"  # ENGINE_METADATA
requires-dist = [
  "pydantic<3,>=2.13",
  'azure-identity>=1.26.0; extra == "azure"',
  'azure-mgmt-resourcegraph<9,>=8.0.0; extra == "azure"',
  'azure-mgmt-network>=33.1.0; extra == "azure"',
  'azure-mgmt-monitor<8,>=7.0.0; extra == "azure"',
  'azure-monitor-query<3,>=2.0.0; extra == "azure"',
  'azure-mgmt-costmanagement<6,>=5.0.0; extra == "azure"',
  'azure-mgmt-loganalytics<15,>=14.0.0; extra == "azure"',
]
provides-extra = ["azure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "error::DeprecationWarning:network_assessment",
  # starlette 1.7 prefers httpx2 for its TestClient; httpx is the client this edition pins (brief), so the notice is muted
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true
