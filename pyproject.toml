[project]
name = "hcw-addon-network-assessment"
version = "0.1.1"
description = "Hybrid Cloud Works Network Assessment, lab edition: evaluate an Azure Resource Graph export of microsoft.network/* resources against ported, typed network rules, in memory, with no cloud connectivity by design."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14.6,<3.15"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  # ENGINE_REF none -- the interim port runs; core-update.yml replaces this whole line with the engine wheel pin
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.17.3",
  "httpx==0.28.1",
  "pip-audit==2.10.1",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/network_assessment"]

[tool.hatch.metadata]
# The engine wheel is pinned by its release URL (the marked engine dependency line); hatchling refuses a direct reference
# without this. uv.lock carries the wheel's sha256 and the image installs with --require-hashes.
allow-direct-references = true

[tool.uv]
# One project, no workspace member: the ported engine under src/network_assessment/{model,rules,classify} is interim
# (ADR-0001) and is deleted, not handed upstream, once the engine wheel pinned on the marked dependency line is
# adopted (src/network_assessment/engine.py picks whichever is installed).
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "error::DeprecationWarning:network_assessment",
  # starlette 1.7 prefers httpx2 for its TestClient; httpx is the client this edition pins (brief), so the notice is muted
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true
