[project]
name = "hcw-addon-network-assessment"
version = "0.1.0"
description = "Hybrid Cloud Works Network Assessment, lab edition: evaluate an Azure Resource Graph export of microsoft.network/* resources against ported, typed network rules, in memory, with no cloud connectivity by design."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14.6,<3.15"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.17.1",
  "httpx==0.28.1",
  "pip-audit==2.10.1",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/network_assessment"]

[tool.uv]
# One project, no workspace member: the ported engine under src/network_assessment/{model,rules,classify} is interim
# (ADR-0001) and is deleted, not handed upstream, once cna-azure-network-engine (published as engine-v0.1.0) is adopted.
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "error::DeprecationWarning:network_assessment",
  # starlette 1.7 prefers httpx2 for its TestClient; httpx is the client this edition pins (brief), so the notice is muted
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true
