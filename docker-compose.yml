# Local development only (the lab host runs one docker_container per AddOn through the website's `addons` Ansible role;
# Compose is reserved for Coder there, ADR 0032). Hardened the same way the role runs it.
services:
  network-assessment:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      args: { EDITION: lab }
    image: img-ne-lab-addon:dev
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      NA_ALLOW_NO_TURNSTILE: "1"   # local only: uploads without human verification, logged as a warning at startup
      NA_FRAME_ANCESTORS: "'none'"
      NA_SITE_ORIGINS: ""
      NA_ALLOWED_ORIGINS: ""
      NA_TRUST_PROXY: "0"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256
    cpus: 1
    restart: unless-stopped
    init: true
